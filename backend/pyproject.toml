[project]
name = "backend"
version = "0.1.0"
description = "FastAPI voice-to-text backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "huggingface-hub>=0.36.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "uvicorn>=0.35.0",
    "sherpa-onnx==1.13.2+cuda12.cudnn9",
    "vieneu[gpu]>=2.7.0",
    "onnxruntime-gpu>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
exclude-dependencies = ["onnxruntime"]
find-links = ["https://k2-fsa.github.io/sherpa/onnx/cuda.html"]
