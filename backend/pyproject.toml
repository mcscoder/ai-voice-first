[project]
name = "backend"
version = "0.1.0"
description = "FastAPI voice-to-text backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi>=0.116.0",
    "huggingface-hub>=0.36.0",
    "httpx>=0.28.1",
    "onnxruntime==1.24.4",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "sherpa-onnx>=1.12.10",
    "soundfile>=0.13.1",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
